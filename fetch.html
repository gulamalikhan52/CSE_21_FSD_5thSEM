<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MY SHOP</title>

    <style>
      table {
        width: 80%;
        margin: auto;
        padding: 10px;
        font-size: 25px;
        color: red;
        border: 2px solid red;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>s.no</th>
          <th>title</th>
          <th>image</th>
          <th>category</th>
          <th>price</th>
        </tr>
      </thead>
      <tbody id="data"></tbody>
    </table>
    <script>
      const ele = document.getElementById("data");
      const URL = "https://dummyjson.com/products";
      async function load_data() {
        try {
          const res = await fetch(URL);
          const data = await res.json();
          console.log("Data", data.products);

          let row = "";
          data.products.map((i, index) => {
            row += `
               <tr>
                 <td>${index + 1}</td>
                 <td>${i.title}</td>
                 <td><img src=${i.images[0]} width="100px" height="100px"/></td>
                 <td>${i.category}</td>
                 <td>${i.price}</td>
               </tr>
               `;
            ele.innerHTML = row;
          });
        } catch (err) {
          console.error("Error fetching data:", err);
        }
      }
      load_data();
    </script>
  </body>
</html>
