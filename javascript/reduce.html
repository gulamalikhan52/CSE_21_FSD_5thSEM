  <body>
    <script>
      const num = [22, 24, 43, 35, 364, 57, 879, 78];
      const even = num.filter((n) => n % 2 == 0);

      const square = even.map((n) => n * n);

      const sum = square.reduce((i, s) => i + s);
      console.log(sum);
    </script>
  </body>
